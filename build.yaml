# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property.
---
include:
  # --- Novo Corne V3 Choc (PandaKB PCB) ---
  - board: nice_nano/nrf52840/zmk
    shield: corne_left
    artifact-name: corne_pcb_left
  - board: nice_nano/nrf52840/zmk
    shield: corne_right
    snippet: studio-rpc-usb-uart
    artifact-name: corne_pcb_right

  # --- Corne Handwired (Placa antiga) ---
  - board: nice_nano/nrf52840/zmk
    shield: corne_hw_left
    artifact-name: corne_hw_left
  - board: nice_nano/nrf52840/zmk
    shield: corne_hw_right
    snippet: studio-rpc-usb-uart
    artifact-name: corne_hw_right

  # --- Settings Reset ---
  - board: nice_nano/nrf52840/zmk
    shield: settings_reset
    artifact-name: settings_reset
